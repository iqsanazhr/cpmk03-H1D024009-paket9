<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Coinbase Signature Royal Blue -->
    <linearGradient id="coinbaseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF"/>
      <stop offset="100%" stop-color="#0045E6"/>
    </linearGradient>

    <!-- Subtle Inner Glow -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Drop Shadow for App Icon -->
    <filter id="appShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0035A8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base (iOS App Icon 512x512) -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#coinbaseBg)" filter="url(#appShadow)"/>
  <rect x="25" y="25" width="462" height="462" rx="115" fill="none" stroke="url(#innerGlow)" stroke-width="2"/>

  <!-- Main Emblem Group: Centered Mathematically at (256, 256) -->
  <g id="emblem">
    <!-- 1. The Iconic Coinbase "C" Ring (Clean, Rounded, Symmetrical) -->
    <!-- Arc centered at (256, 256), radius 132, from -40 deg to +220 deg with rounded caps -->
    <path d="M 357 171 A 132 132 0 1 0 357 341" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="44" 
          stroke-linecap="round"/>

    <!-- 2. Centered Minimalist Storefront & Growth Icon (UMKM Commerce) -->
    <g id="storefront">
      <!-- Storefront Awning (Sleek Geometric Silhouette) -->
      <path d="M 194 218 L 318 218 L 306 188 C 304 184 300 182 295 182 L 217 182 C 212 182 208 184 206 188 Z" 
            fill="#FFFFFF"/>
      
      <!-- Awning Scallops (3 Clean Curves) -->
      <path d="M 194 218 Q 214 232 235 218 Q 256 232 277 218 Q 297 232 318 218 L 318 214 L 194 214 Z" 
            fill="#FFFFFF"/>

      <!-- Boutique Display Box / Counter -->
      <rect x="208" y="242" width="96" height="72" rx="18" fill="#FFFFFF"/>

      <!-- Upward Profit Margin Growth Arrow (Cutout in Negative Space) -->
      <path d="M 256 294 L 256 260 M 256 260 L 243 273 M 256 260 L 269 273" 
            stroke="#0052FF" 
            stroke-width="6" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>
  </g>
</svg>
